<meta name="theme-color" content="#A01020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayPiano Facility</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;border-bottom:0.5px solid #e0e0e0;display:flex;position:sticky;top:0;z-index:10;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none} nav button{flex:1 1 0;padding:10px 8px;min-width:60px;font-size:10px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{border-bottom:2px solid #A01020;color:#A01020}
nav button svg{width:18px;height:18px}
main{flex:1;padding:8px 12px;padding-bottom:20px}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{background:#f5f5f5;border-radius:8px;padding:12px;border:0.5px solid #e8e8e8}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500;color:#1a1a1a}
.metric-sub{font-size:11px;color:#888;margin-top:2px}
.section-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.scad-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.scad-card:hover{background:#fafafa}
.scad-card.urgente{border-left:3px solid #E24B4A}
.scad-card.warning{border-left:3px solid #EF9F27}
.scad-card.ok{border-left:3px solid #639922}
.scad-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scad-nome{font-weight:500;font-size:14px}
.scad-meta{font-size:12px;color:#888;margin-top:3px}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.badge-red{background:#FCEBEB;color:#791F1F}
.badge-orange{background:#FAEEDA;color:#633806}
.badge-green{background:#EAF3DE;color:#A01020}
.badge-blue{background:#fdeced;color:#A01020}
.piano-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.piano-card:hover{background:#fafafa}
.piano-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.piano-meta{font-size:12px;color:#888;display:flex;gap:8px;flex-wrap:wrap}
.search-bar{margin-bottom:10px}
.search-bar input{width:100%;padding:8px 12px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;outline:none}
.search-bar input:focus{border-color:#A01020}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.filter-btn{padding:5px 12px;border:0.5px solid #e0e0e0;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:#fff;color:#888}
.filter-btn.active{background:rgba(160,16,32,0.90);color:#fff;border-color:#A01020}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid #f0f0f0;font-size:13px}
.summary-row:last-child{border-bottom:none}
.bar-wrap{margin-bottom:8px}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:3px}
.bar{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#555}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end}
.sheet{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-height:85vh;overflow-y:auto}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid #f0f0f0;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#888;flex-shrink:0;margin-right:12px}
.close-btn{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;line-height:1}
.btn-primary{background:rgba(160,16,32,0.90);color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%}
.btn-primary:hover{background:#A01020}
.btn-secondary{background:none;color:#888;border:0.5px solid #e0e0e0;padding:9px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;margin-top:8px}
.btn-google{background:#fff;color:#3c4043;border:0.5px solid #e0e0e0;padding:11px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.btn-google:hover{background:#fafafa}
.upload-area{border:1.5px dashed #e0e0e0;border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:12px}
.upload-area:hover{background:#fafafa}
.empty-state{text-align:center;padding:48px 16px;color:#888}
.alert-banner{border-radius:8px;padding:10px 14px;margin-bottom:10px;cursor:pointer}
.alert-red{background:#FCEBEB;border-left:3px solid #E24B4A}
.alert-orange{background:#FAEEDA;border-left:3px solid #EF9F27}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.month-nav button{background:none;border:0.5px solid #e0e0e0;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13px;color:#1a1a1a}
.month-nav span{font-size:15px;font-weight:500}
.month-totals{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:0.5px solid #f0f0f0}
.day-label{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 6px}
.connected-dot{width:8px;height:8px;border-radius:50%;background:#639922;display:inline-block;margin-right:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:#A01020;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.wa-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.wa-box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:440px}
.wa-box textarea{width:100%;height:120px;padding:10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;margin:12px 0}
.wa-box .wa-nome{font-size:15px;font-weight:500;margin-bottom:4px}
.wa-box .wa-sub{font-size:12px;color:#888;margin-bottom:12px}
.btn-wa{background:#25D366;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wa:hover{background:#1da851}
.btn-wa-small{background:#25D366;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap}
.sent-badge{font-size:10px;color:#A01020;background:#fdeced;padding:2px 6px;border-radius:8px;display:inline-flex;align-items:center;gap:3px;margin-top:3px}
.hero-card{background:rgba(160,16,32,0.90);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end}
.report-banner{background:#fff;border:1.5px solid #A01020;border-radius:12px;padding:14px;margin-bottom:12px}

/* ===== Sezioni Annunci (Preventivi/Matricole): stile confinato sotto .annx ===== */
.annx *{box-sizing:border-box;margin:0;padding:0}
.annx .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:650px){.annx .grid{grid-template-columns:1fr}}
.annx .card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:16px}
.annx .card:last-child{margin-bottom:0}
.annx h2{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;margin-top:18px}
.annx h2:first-child{margin-top:0}
.annx .field{margin-bottom:12px}
.annx label{font-size:11px;color:#888;display:block;margin-bottom:4px;font-weight:500}
.annx select,.annx input[type=text],.annx input[type=number]{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none;appearance:none;-webkit-appearance:none}
.annx select:focus,.annx input:focus{border-color:#A01020}
.annx .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.annx .checkbox-list{display:flex;flex-direction:column;gap:8px}
.annx .checkbox-item{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;color:#333}
.annx .checkbox-item input[type=checkbox]{margin-top:2px;accent-color:#A01020;width:15px;height:15px;flex-shrink:0;cursor:pointer}
.annx .frase-altro textarea{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none;resize:vertical;min-height:60px;font-family:inherit;margin-top:8px}
.annx .frase-altro textarea:focus{border-color:#A01020}
.annx .preview-box{white-space:pre-wrap;font-size:13px;line-height:1.7;color:#1a1a1a;background:#f9f9f9;border:0.5px solid #e0e0e0;border-radius:8px;padding:14px;min-height:200px;font-family:inherit}
.annx .btn-primary{background:rgba(160,16,32,0.9);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:12px;transition:background 0.2s}
.annx .btn-primary:hover{background:#A01020}
.annx .btn-primary.copied{background:#639922}
.annx .prezzi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.annx .euro-wrap{position:relative}
.annx .euro-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888;font-size:13px;pointer-events:none}
.annx .euro-wrap select{padding-left:22px}
.annx .servizi-list{display:flex;flex-direction:column;gap:8px}
.annx .servizio-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#333}
.annx .servizio-item input[type=checkbox]{accent-color:#A01020;width:15px;height:15px;cursor:pointer;flex-shrink:0}
.annx .matricola-input-wrap{position:relative}
.annx .matricola-input-wrap input{font-size:16px;font-weight:500;padding:12px 14px;letter-spacing:1px}
.annx .result-box{border-radius:10px;padding:16px;margin-top:14px;text-align:center}
.annx .result-box.found{background:#fdeced;border:1.5px solid #A01020}
.annx .result-box.notfound{background:#f5f5f5;border:0.5px solid #e0e0e0}
.annx .result-anno{font-size:32px;font-weight:600;color:#A01020;margin-bottom:4px}
.annx .result-label{font-size:12px;color:#888}
.annx .result-luogo{font-size:13px;color:#555;margin-top:6px;font-weight:500}
.annx .result-range{font-size:11px;color:#999;margin-top:4px}
.annx .info-box{background:#f9f9f9;border:0.5px solid #e0e0e0;border-radius:8px;padding:12px;font-size:12px;color:#666;line-height:1.6;margin-top:12px}
.annx .info-box strong{color:#1a1a1a}
.annx .usa-annuncio-btn{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;background:#fff;border:0.5px solid #A01020;border-radius:8px;font-size:13px;color:#A01020;font-weight:500;cursor:pointer;width:100%;justify-content:center}
.annx .usa-annuncio-btn:hover{background:#fdeced}
.annx .btn-tipo-prev{background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;padding:16px 8px;font-size:13px;font-weight:500;cursor:pointer;color:#1a1a1a;transition:all 0.15s;text-align:center;width:100%}
.annx .btn-tipo-prev:hover{border-color:#A01020;color:#A01020;background:#fdeced}
.annx .btn-tipo-prev.active{background:rgba(160,16,32,0.9);color:#fff;border-color:#A01020}
.annx .prev-section{margin-bottom:12px}
.annx .prev-label{font-size:11px;color:#888;font-weight:500;margin-bottom:4px;display:block}
.annx .prev-input{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:#fff;color:#1a1a1a}
.annx .prev-input:focus{border-color:#A01020}
.annx .prev-textarea{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;font-family:inherit;resize:vertical;min-height:70px;background:#fff;color:#1a1a1a}
.annx .piano-block{background:#f9f9f9;border:0.5px solid #e8e8e8;border-radius:10px;padding:12px;margin-bottom:10px}
.annx .piano-block-title{font-size:12px;font-weight:600;color:#A01020;margin-bottom:10px}
.annx .prev-check-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.annx .prev-check-row input[type=checkbox]{accent-color:#A01020;width:15px;height:15px;flex-shrink:0}
.annx .spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#A01020;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Layout launcher (home a pulsanti, stile playpiano-suite) ===== */
#pp-home{max-width:480px;margin:0 auto;padding:14px 16px 36px;min-height:100vh}
.pp-logo-wrap{text-align:center;padding:20px 0 4px}
.pp-logo-wrap svg{width:60%;max-width:230px;height:auto}
.pp-subtitle{text-align:center;font-size:12px;color:#999;letter-spacing:.03em;margin-bottom:24px}
.pp-menu{display:flex;flex-direction:column;gap:11px}
.pp-navbtn{display:flex;align-items:center;gap:14px;width:100%;background:#A01020;color:#fff;border:none;border-radius:14px;padding:18px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;line-height:1.2;transition:transform .08s,background .15s}
.pp-navbtn:hover{background:#8a0e1b}
.pp-navbtn:active{transform:scale(.985)}
.pp-navbtn svg{width:24px;height:24px;flex-shrink:0}
.pp-navbtn .lbl{flex:1}
.pp-navbtn .chev{font-size:20px;opacity:.55;font-weight:400}
.pp-divider{height:1px;background:#e3e3e3;margin:5px 4px}
#pp-viewer{display:none;position:fixed;inset:0;background:#f5f5f5;flex-direction:column;z-index:1000}
.pp-topbar{display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;border-bottom:.5px solid #e0e0e0;flex-shrink:0}
.pp-backbtn{display:flex;align-items:center;gap:4px;background:#fff;border:.5px solid #A01020;color:#A01020;font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.pp-backbtn:active{background:#fdeced}
.pp-sectitle{font-size:15px;font-weight:600;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pp-viewer-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pp-inner{max-width:480px;margin:0 auto;padding:14px 16px 32px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CLIENT_ID='267543971233-fsb8goidid2r97ddgii7lvn0ntl9fjnr.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/contacts.readonly https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar';
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MONTHS_SHORT=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
let pianos=[],contatti=[],lastSync=null,gToken=null;
let currentTab='sync',filterStato='ALL',searchQ='';
let viewMonth=new Date().getMonth(),viewYear=new Date().getFullYear();
let clientiSezione='scadenze';

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function load(){
  try{const d=lsGet('pf_pianos');if(d)pianos=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_contatti');if(d)contatti=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_sync');if(d)lastSync=d;}catch(e){}
  try{const d=lsGet('pf_gtoken');if(d)gToken=d;}catch(e){}
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const params=new URLSearchParams(hash.substring(1));
    const tok=params.get('access_token');
    if(tok){
      gToken=tok;lsSet('pf_gtoken',tok);
      history.replaceState(null,'',window.location.pathname);
      setTimeout(()=>{openSection('sync');syncContatti();},500);
    }
  }
}

function showTab(t){
  currentTab=t;searchQ='';
  ['sync','contratti','concerti','preventivi','matricole'].forEach(function(x){var b=document.getElementById('tab-'+x);if(b)b.classList.toggle('active',x===t);});
  var mc=document.getElementById('main-content');
  var ap=document.getElementById('ann-preventivi');
  var am=document.getElementById('ann-matricole');
  if(t==='preventivi'){mc.style.display='none';ap.style.display='block';am.style.display='none';}
  else if(t==='matricole'){mc.style.display='none';ap.style.display='none';am.style.display='block';cercaMatricola();}
  else{mc.style.display='block';ap.style.display='none';am.style.display='none';render();}
}
function render(){
  const m=document.getElementById('main-content');
  if(currentTab==='giornata')m.innerHTML=renderGiornata();
  else if(currentTab==='dispo')m.innerHTML=renderDisponibilita();
  else if(currentTab==='sync')m.innerHTML=renderSync();
  else if(currentTab==='contratti')m.innerHTML=renderContratti();
  else if(currentTab==='concerti')m.innerHTML=renderConcerti();
}

function googleAuth(){
  const redirectUri=window.location.origin+window.location.pathname;
  const params=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri,response_type:'token',scope:SCOPE,prompt:'consent'});
  window.location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}

async function apiGet(url){
  const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
  if(res.status===401){gToken=null;lsDel('pf_gtoken');render();throw new Error('Token scaduto. Riconnetti.');}
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data;
}

async function syncContatti(){
  if(!gToken){googleAuth();return;}
  const setStatus=msg=>{const el=document.getElementById('sync-status');if(el)el.innerHTML=msg;};
  setStatus('<span class="spinner"></span>Cerco gruppi...');
  try{
    // Step 1: trova ID del gruppo NOLO LUNGO TERMINE
    const groupsData=await apiGet('https://people.googleapis.com/v1/contactGroups?pageSize=200&groupFields=name,memberCount');
    const gruppi=groupsData.contactGroups||[];
    
    // Debug: mostra tutti i gruppi
    const nomiGruppi=gruppi.map(g=>g.name+'('+g.memberCount+')').join(' | ');
    setStatus('<span class="spinner"></span>Gruppi trovati: '+nomiGruppi);
    
    const gruppo=gruppi.find(g=>{
      const n=(g.name||'').toUpperCase();
      const fn=(g.formattedName||'').toUpperCase();
      return n.includes('NOLO')||fn.includes('NOLO');
    });
    
    if(!gruppo){
      setStatus('<span style="color:#A32D2D">Gruppo NOLO non trovato. Gruppi disponibili: '+nomiGruppi+'</span>');
      return;
    }

    setStatus('<span class="spinner"></span>Gruppo trovato: '+gruppo.name+' ('+gruppo.memberCount+' membri). Carico...');

    // Step 2: prendi i membri del gruppo
    const membData=await apiGet('https://people.googleapis.com/v1/'+gruppo.resourceName+'?maxMembers=500');
    const members=membData.memberResourceNames||[];
    
    if(!members.length){
      setStatus('<span style="color:#854F0B">Gruppo vuoto.</span>');
      return;
    }

    setStatus('<span class="spinner"></span>'+members.length+' contatti. Carico dettagli...');

    // Step 3: batch get dei contatti
    const parsed=[];
    for(let i=0;i<members.length;i+=50){
      const chunk=members.slice(i,i+50);
      const qp=new URLSearchParams();
      chunk.forEach(m=>qp.append('resourceNames',m));
      qp.set('personFields','names,phoneNumbers,addresses,biographies,events');
      const data=await apiGet('https://people.googleapis.com/v1/people:batchGet?'+qp.toString());
      (data.responses||[]).forEach(r=>{
        const p=r.person;if(!p)return;
        const dates=(p.events||[]).filter(e=>e.date&&e.date.month).map(e=>({
          date:(e.date.year||new Date().getFullYear())+'-'+String(e.date.month).padStart(2,'0')+'-'+String(e.date.day||1).padStart(2,'0'),
          label:e.formattedType||e.displayName||e.type||'Data importante'
        }));
        parsed.push({
          id:p.resourceName,
          nome:p.names?.[0]?.displayName||'—',
          telefono:p.phoneNumbers?.[0]?.value||'',
          indirizzo:p.addresses?.[0]?.formattedValue||'',
          notes:p.biographies?.[0]?.value||'',
          dates
        });
      });
      setStatus('<span class="spinner"></span>Caricati '+(i+chunk.length)+'/'+members.length+'...');
    }

    contatti=parsed;lastSync=new Date().toLocaleString('it-IT');
    lsSet('pf_contatti',contatti);lsSet('pf_sync',lastSync);
    setStatus('<span style="color:#A01020">✓ '+parsed.length+' contatti · '+contatti.reduce((s,c)=>s+(c.dates||[]).length,0)+' date importate.</span>');
    setTimeout(()=>render(),1500);

  }catch(err){
    setStatus('<span style="color:#A32D2D">Errore: '+err.message+'</span>');
  }
}

function disconnectGoogle(){if(!confirm('Disconnettere?'))return;gToken=null;lsDel('pf_gtoken');render();}

function parseCanone(notes){
  if(!notes)return null;
  const m=notes.match(/canone\s+annuo\s*[€£]?\s*(\d[\d.,]*)/i);
  if(m)return parseFloat(m[1].replace(',','.'));
  return null;
}

















function renderSync(){
  return `<div class="card">

function cercaClienteContratto(q){

function selezionaClienteContratto(id){
  const c=contatti.find(x=>x.id===id);
  if(!c) return;
  const notes=c.notes||'';

  // Parse notes line by line
  const lines=notes.split('\n');
  let cf='',marca='',modello='',matricola='',canone='',trasporto='',colore='',finitura='';
  const silentM=notes.toLowerCase().includes('silent');
  const emailM=notes.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i);

  lines.forEach(line=>{
    const l=line.trim();
    // CF: "C.F. XXXXXXXXXXXXXXXX"
    const cfMatch=l.match(/C\.F\.\s+([A-Z0-9]{6,16})/i);
    if(cfMatch) cf=cfMatch[1].toUpperCase();

    // "Yamaha U3A Matricola 4272290"
    const pianoMatch=l.match(/^(\S+)\s+(\S+)\s+Matricola\s+(\d+)/i);
    if(pianoMatch){marca=pianoMatch[1].toUpperCase();modello=pianoMatch[2].toUpperCase();matricola=pianoMatch[3];}

    // "Canone Annuo € 660 + € 200 Trasporto"
    const canoneMatch=l.match(/Canone\s+Annuo[^\d]*(\d+)/i);
    if(canoneMatch) canone=canoneMatch[1];
    const trasportoMatch=l.match(/\+[^\d]*(\d+)\s*Trasporto/i);
    if(trasportoMatch) trasporto=trasportoMatch[1];

    // Colore/Finitura se scritti esplicitamente
    const coloreMatch=l.match(/^Colore[:\s]+(.+)/i);
    if(coloreMatch) colore=coloreMatch[1].trim().toUpperCase();
    const finituraMatch=l.match(/^Finitura[:\s]+(.+)/i);
    if(finituraMatch) finitura=finituraMatch[1].trim();
  });

  contrattoForm={
    ...contrattoForm,
    clienteId:c.id,
    nome:c.nome,
    indirizzo:(c.indirizzo||'').replace(/\n/g,' ').replace(/\s+/g,' ').trim(),
    telefono:(c.telefono||'').replace(/^\+39\s*/,''),
    email:emailM?emailM[0]:'',
    cf,marca,modello,matricola,colore,finitura,
    canone,
    trasportoConsegna:trasporto,
    silent:silentM,
  };
  contrattoClienteSearch='';
  render();
}

async function generaContratto(){
  const btn=document.getElementById('btn-genera');
  const status=document.getElementById('contratto-status');
  btn.disabled=true;btn.textContent='Generazione...';
  const f=contrattoForm;
  const num=parseInt(lsGet('pf_contratto_num')||'333');
  const canoneM=f.canone?Math.round(parseFloat(f.canone)/12):0;
  const rataMesi=f.tipoRata==='personalizzato'?f.mesiRata:
    f.tipoRata==='annuale'?12:f.tipoRata==='semestrale'?6:
    f.tipoRata==='quadrimestrale'?4:f.tipoRata==='trimestrale'?3:1;
  const rataLabel=f.tipoRata==='personalizzato'?'ogni '+f.mesiRata+' mesi':
    f.tipoRata==='annuale'?'Annuali Anticipate':
    f.tipoRata==='semestrale'?'Semestrali':
    f.tipoRata==='quadrimestrale'?'Quadrimestrali':
    f.tipoRata==='trimestrale'?'Trimestrali':'Mensili';
  const rataImporto=Math.round(parseFloat(f.canone||0)/12*rataMesi);
  const dataFmt=f.dataInizio?new Date(f.dataInizio).toLocaleDateString('it-IT'):'';

  try{
    status.innerHTML='<span class="spinner"></span>Invio dati ad Apps Script...';
    const payload={
      numero:num,
      nome:f.nome,
      indirizzo:f.indirizzo,
      telefono:f.telefono,
      cf:f.cf||'',
      email:f.email||'',
      marca:f.marca,
      modello:f.modello+(f.silent?' (SILENT)':''),
      colore:f.colore,
      finitura:f.finitura,
      matricola:f.matricola,
      valore:f.valore,
      valore_sgabello:f.valoreSgabello||'80',
      silent:f.silent,
      canone:f.canone,
      canone_mensile:String(canoneM)+'.00',
      tipo_rata:rataLabel,
      durata:f.durataAnni,
      trasporto_consegna:f.trasportoConsegna||'0',
      trasporto_ritiro:f.trasportoRitiro||'0',
      tipo_contratto:f.tipoContratto,
      data_inizio:f.dataInizio,
      luogo:f.luogo,
      nome_breve:f.nome.split(' ')[0],
    };

    // Apps Script requires no-cors for POST, use GET with params for simple calls
    // Or use a form submit approach
    const res=await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body:JSON.stringify(payload),
      headers:{'Content-Type':'text/plain'},
      redirect:'follow'
    });
    const text=await res.text();
    let data;
    try{ data=JSON.parse(text); }
    catch(e){ throw new Error('Risposta non valida da Apps Script: '+text.substring(0,100)); }

    if(data.success){
      lsSet('pf_contratto_num',String(num+1));
      status.innerHTML='<span style="color:#A01020;font-weight:500">✓ Contratto #'+num+' salvato su Drive!</span><br>'
        +(data.wordUrl?'<a href="'+data.wordUrl+'" target="_blank" style="font-size:12px;color:#555;margin-right:12px">📄 Apri Word</a>':'')
        +(data.pdfUrl?'<a href="'+data.pdfUrl+'" target="_blank" style="font-size:12px;color:#A01020">📕 Apri PDF</a>':'');
      btn.textContent='✓ Salvato';
    } else {
      throw new Error(data.error||'Errore sconosciuto');
    }
  }catch(err){
    status.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
    btn.disabled=false;btn.textContent='Riprova';
  }
}

async function uploadDrive(blob,mime,name,folder){
  const meta={name,parents:[folder]};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',blob);
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{Authorization:'Bearer '+gToken},body:form
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Upload fallito');}
  return res.json();
}

async function loadJSZip(){
  if(window.JSZip) return window.JSZip;
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>resolve(window.JSZip);
    s.onerror=()=>reject(new Error('JSZip non caricato'));
    document.head.appendChild(s);
  });
}

function wPara(text,bold,align){
  align=align||'left';
  const rpr=bold?'<w:rPr><w:b/></w:rPr>':'';
  return '<w:p><w:pPr><w:jc w:val="'+align+'"/></w:pPr><w:r>'+rpr+'<w:t xml:space="preserve">'+xmlEsc(text)+'</w:t></w:r></w:p>';
}

async function creaDocx(f,num,canoneM,rataLabel,rataImporto,dataFmt,JSZip){
  const durata=f.durataAnni===1?'1 ANNO':f.durataAnni+' ANNI';
  const tipoStr=f.tipoContratto==='scalare'
    ?'CONTRATTO A SCALARE: Il contratto a scalare permette al cliente di recuperare non solo le 12 mensilitÃ  di noleggio pagate per il primo anno, ma anche PARTE delle mensilitÃ  di noleggio versate per gli anni successivi al primo.'
    :"CONTRATTO STANDARD: Il contratto standard prevede che al cliente, in caso di ACQUISTO DEL PIANOFORTE, vengano riconosciute e scalate dal prezzo di acquisto, esclusivamente le 12 mensilitÃ  pagate nel primo anno di noleggio.";
  const body=[
    wPara('PIANO SERVICE S.N.C. di Rodolfo Ghirardello & C.',true,'center'),
    wPara('Via Luigi Einaudi 34, 45100 Rovigo',false,'center'),
    wPara('Tel. +39 328.2214617  +39 328.2282006  Mail info@pianofortiplaypiano.it',false,'center'),
    wPara('P.IVA 01604450294  PEC pianofortiplaypiano@pec.it',false,'center'),
    wPara(''),
    wPara('CONTRATTO DI NOLEGGIO PIANOFORTE N. '+num,true,'center'),
    wPara(''),
    wPara('La societa Piano Service S.N.C. di Rodolfo Ghirardello & C. con sede in Rovigo Via Luigi Einaudi 34, concede in affitto'),
    wPara('al(la) Sig.(ra) '+f.nome,true),
    wPara('Residente / domiciliato '+f.indirizzo),
    wPara('Tel. '+f.telefono+(f.cf?'     C.F. '+f.cf:'')),
    wPara('email: '+(f.email||'')),
    wPara(''),
    wPara("Nell'abitazione / in "+f.indirizzo),
    wPara(''),
    wPara('Un Pianoforte Marca '+f.marca+' Modello '+f.modello+' Colore '+f.colore+' tipo di finitura '+f.finitura+(f.silent?' (SILENT)':'')),
    wPara('Matricola: '+f.matricola),
    wPara('Del valore di EUR '+f.valore+' + Sgabello Regolabile Professionale INCLUSO'),
    wPara(''),
    wPara('Alle seguenti condizioni:',true),
    wPara('1. La validita del presente contratto e di '+durata+" e s'intende tacitamente rinnovato salvo disdetta da comunicarsi almeno 30 (trenta) giorni prima della scadenza."),
    wPara("2. L'importo a titolo di noleggio e fissato in EUR "+canoneM+'.00 mensili ('+f.canone+' EUR annui) da corrispondersi in rate '+rataLabel+'. Importo rata: EUR '+rataImporto+'.'),
    wPara("3. Il trasporto all'abitazione del cliente e l'eventuale trasporto di restituzione dello strumento sono a carico del noleggiante."),
    wPara('4. Lo sgabello e INCLUSO nel canone di locazione del pianoforte.'),
    wPara('5. Il Pianoforte viene consegnato in perfetta efficienza e deve essere conservato in luogo asciutto, lontano da termosifoni, stufe, cucine o correnti di aria fredda.'),
    wPara('6. Non e ammesso il trasporto (anche in caso di trasloco) senza la preventiva autorizzazione.'),
    wPara('7. Il noleggiatore si riserva il diritto di visitare e controllare lo stato di conservazione dello strumento e di ritirarlo a suo insindacabile giudizio in qualsiasi momento.'),
    wPara("7. Il mancato pagamento delle quote di noleggio risolve di diritto ogni validita del medesimo."),
    wPara("8. In caso di dissesti finanziari il noleggiante s'impegna a darne tempestivo avviso al noleggiatore."),
    wPara('9. Qualsiasi problematica al pianoforte non imputabile ad un uso non idoneo dello stesso e coperta da garanzia.'),

    wPara(tipoStr,true),
    wPara(''),
    wPara(f.luogo+', '+dataFmt+'          Letto, Accettato e Sottoscritto'),
    wPara(''),
    wPara(''),
    wPara('Gentile '+f.nome.split(' ')[0]+', la ringraziamo per la preferenza accordataci.'),
  ].join('\n');

  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body}<w:sectPr/></w:body></w:document>`;

  const zip=new JSZip();
  zip.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`);
  zip.file('word/document.xml',docXml);
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

<div class="cl">7. Il mancato pagamento delle quote di noleggio, l'inosservanza a quanto contenuto nel presente contratto risolve di diritto ogni validità del medesimo.</div>
<div class="cl">8. In caso di dissesti finanziari con conseguenti eventualità di pignoramenti o di sequestri, il noleggiante s'impegna a darne tempestivo avviso al noleggiatore, che provvederà all'immediato ritiro del pianoforte.</div>
<div class="cl">9. Qualsiasi problematica al pianoforte, non imputabile ad un uso non idoneo dello stesso da parte del noleggiante, è coperta da garanzia. Il noleggiatore si impegna a ripristinare il corretto funzionamento dello strumento nel minor tempo possibile.</div>

function parseNotesConcerto(notes){
  if(!notes) return {};
  const r={};
  notes.split('\n').forEach(l=>{
    const pm=l.match(/Pianoforte[:\s]+(.+)/i); if(pm) r.pianoforte=pm[1].trim().toUpperCase();
    const lm=l.match(/Location[:\s]+(.+)/i); if(lm) r.location=lm[1].trim();
    const im=l.match(/Indirizzo[:\s]+(.+)/i); if(im) r.indirizzo=im[1].trim();
    const cm=l.match(/Compenso[:\s]+(.+)/i); if(cm) r.compenso=cm[1].trim().replace(/\+IVA/i,'').trim();
    const pg=l.match(/Pagamento[:\s]+(.+)/i); if(pg) r.metodoPagamento=pg[1].trim();
    const ko=l.match(/Consegna[:\s]+(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}:\d{2})/i); if(ko){r.dataConsegna=ko[1];r.oraConsegna=ko[2];}
    const rm=l.match(/Ritiro[:\s]+(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}:\d{2})/i); if(rm){r.dataRitiro=rm[1];r.oraRitiro=rm[2];}
    const r1=l.match(/Referente1[:\s]+(.+)/i); if(r1){const p=r1[1].trim().split(' ');r.contatto1nome=p.slice(0,-1).join(' ');r.contatto1tel=p[p.length-1];}
    const r2=l.match(/Referente2[:\s]+(.+)/i); if(r2){const p=r2[1].trim().split(' ');r.contatto2nome=p.slice(0,-1).join(' ');r.contatto2tel=p[p.length-1];}
    const r3=l.match(/Referente3[:\s]+(.+)/i); if(r3){const p=r3[1].trim().split(' ');r.contatto3nome=p.slice(0,-1).join(' ');r.contatto3tel=p[p.length-1];}
    const nm=l.match(/Note[:\s]+(.+)/i); if(nm) r.note=nm[1].trim();
  });
  return r;
}

async function syncConcerti(){
  if(!gToken){googleAuth();return;}
  const st=document.getElementById('concerti-status');
  if(st) st.innerHTML='<span class="spinner"></span>Carico...';
  try{
    const from=new Date(new Date().getFullYear()-1,0,1).toISOString();
    const to=new Date(new Date().getFullYear()+2,11,31).toISOString();

    // 1. Prende lista di tutti i calendari
    const calListRes=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{Authorization:'Bearer '+gToken}});
    const calList=await calListRes.json();
    if(calList.error) throw new Error(calList.error.message);

    // 2. Per ogni calendario recupera gli eventi
    const allItems=[];
    for(const cal of (calList.items||[])){
      const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal.id)+'/events?timeMin='+encodeURIComponent(from)+'&timeMax='+encodeURIComponent(to)+'&singleEvents=true&orderBy=startTime&maxResults=500';
      const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
      const data=await res.json();
      if(!data.error)(data.items||[]).forEach(e=>allItems.push(e));
    }

    // 3. Filtra per keyword concerti
    concerti=allItems.filter(e=>KEYWORDS_CONCERTI.some(k=>(e.summary||'').toLowerCase().includes(k))).map(e=>{
      const p=parseNotesConcerto(e.description||'');
      return {id:e.id,titolo:e.summary||'',data:(e.start.date||e.start.dateTime||'').substring(0,10),luogo:e.location||'',location:p.location||'',indirizzo:p.indirizzo||'',pianoforte:p.pianoforte||'',compenso:p.compenso||'',metodoPagamento:p.metodoPagamento||'',dataConsegna:p.dataConsegna||'',oraConsegna:p.oraConsegna||'',dataRitiro:p.dataRitiro||'',oraRitiro:p.oraRitiro||'',contatto1nome:p.contatto1nome||'',contatto1tel:p.contatto1tel||'',contatto2nome:p.contatto2nome||'',contatto2tel:p.contatto2tel||'',contatto3nome:p.contatto3nome||'',contatto3tel:p.contatto3tel||'',note:p.note||''};
    });

    lsSet('pf_concerti',concerti);
    if(st) st.innerHTML='<span style="color:#A01020">✓ '+concerti.length+' eventi</span>';
    setTimeout(()=>render(),800);
  }catch(err){
    if(st) st.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
  }
}

    ].filter(Boolean).join('\n');
    const event={
      summary:f.titolo,
      location:f.luogo||'',
      description:notes,
      start:{date:f.data},
      end:{date:f.data},
    };
    const res=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+editingConcertoId,{
      method:'PUT',
      headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},
      body:JSON.stringify(event)
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    editingConcertoId=null;
    showFormConcerto=false;
    concertoForm={titolo:'',tipo:'concerto',data:'',luogo:'',location:'',indirizzo:'',pianoforte:'C2',compenso:'',metodoPagamento:'Fattura',dataConsegna:'',oraConsegna:'',dataRitiro:'',oraRitiro:'',contatto1nome:'',contatto1tel:'',contatto2nome:'',contatto2tel:'',contatto3nome:'',contatto3tel:'',note:''};
    await syncConcerti();
  }catch(err){
    alert('Errore: '+err.message);
    btn.disabled=false;btn.textContent='Salva modifiche';
  }
}

function trovaAnno(tabella,seriale){
  // Tabella è array di [anno, seriale_inizio], ordinato per seriale crescente
  const sorted=[...tabella].sort((a,b)=>a[1]-b[1]);
  let risultato=null;
  for(let i=0;i<sorted.length;i++){
    if(seriale>=sorted[i][1]){
      risultato=sorted[i];
    } else break;
  }
  return risultato;
}

function mostraRisultato(r,luogo,inputRaw,btnUsa,resultDiv,nota=''){

  }
  const anno=r[0];
  resultDiv.innerHTML=`<div class="result-box found">
    <div class="result-anno">${anno}</div>
    <div class="result-label">Anno di produzione stimato</div>
    <div class="result-luogo">📍 ${luogo}</div>
    ${nota?`<div class="result-range">${nota}</div>`:''}
  </div>`;
  window._annoTrovato=anno;
  window._matricolaTrovata=inputRaw;
  btnUsa.style.display='flex';
}

/* ================= DIPENDENTI E DISPONIBILITA' =================
   Facility e' l'app che hanno in mano i dipendenti, quindi qui dentro trovano
   la loro giornata e l'elenco degli strumenti. I dati non passano dall'account
   Google di Andrea: arrivano dallo script "Dipendenti PlayPiano", che risponde
   solo a chi ha un codice. Il codice si chiede una volta e resta ricordato.

   La giornata e' scritta qui e non incorniciata dallo script: provato, una
   pagina di Apps Script dentro un iframe di un altro sito resta bianca, perche'
   il suo sandbox non gira in contesto di terze parti. */

const DIP_API = 'https://script.google.com/macros/s/AKfycbzYWadcOB4XJqHMps3kuDQpg1nGUHbtegYrZLe8GEdPhkH91jTajZh_ZwaWu0kuOMq-Zw/exec';

let dipPin='', dipNome='', dipPianoforti=[], dipCerca='', dipStato='N', dipCaricamento=false;
let gioData='', gioLavori=[], gioListini=null, gioForm=null, gioSettimana=null, gioCarico=false, gioCaricata='';

function dipEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dipLeggi(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function dipScrivi(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function gioOggi(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function gioOre(min){ min=parseInt(min,10)||0; var h=Math.floor(min/60), m=min%60; return h ? (h+'h'+(m?' '+m+'m':'')) : (m+'m'); }

async function dipChiedi(azione, dati){
  const qp = new URLSearchParams(Object.assign({api:azione}, dati||{}));
  const res = await fetch(DIP_API + '?' + qp.toString());
  return await res.json();
}

function dipSchermataCodice(errore){

    + (errore ? '<div style="background:#fdeced;color:#A32D2D;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:10px">'+dipEsc(errore)+'</div>' : '')

    + 'style="width:100%;text-align:center;font-size:24px;letter-spacing:.3em;padding:14px;border:0.5px solid #d8d8d8;border-radius:10px;outline:none">'

}

async function dipVerificaCodice(){
  const campo = document.getElementById('dip-pin');
  const pin = (campo && campo.value || '').trim();
  if(!pin) return;
  const m = document.getElementById('main-content');
  m.innerHTML = '<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">Controllo...</div>';
  try{
    const r = await dipChiedi('entra', {pin:pin});
    if(!r.ok){ m.innerHTML = dipSchermataCodice(r.errore); return; }
    dipPin = pin; dipNome = r.dipendente.nome;
    dipScrivi('pf_pin_dip', pin);
    gioData = gioOggi(); gioLavori=[]; gioCaricata=''; gioSettimana=null;
    render();
  }catch(e){ m.innerHTML = dipSchermataCodice('Collegamento non riuscito'); }
}

function dipEsci(){
  dipPin=''; dipNome=''; dipPianoforti=[]; gioLavori=[]; gioCaricata=''; gioSettimana=null;
  try{ localStorage.removeItem('pf_pin_dip'); }catch(e){}
  render();
}

/* ---------- la giornata ---------- */

function gioEtichetta(iso){
  var g=['domenica','lunedi','martedi','mercoledi','giovedi','venerdi','sabato'];
  var m=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var p=iso.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
  var t=(iso===gioOggi())?'Oggi':g[d.getDay()];
  return t+' '+d.getDate()+' '+m[d.getMonth()];
}
function gioPiuGiorni(iso,n){ var p=iso.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function gioLunedi(iso){ var p=iso.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); var g=d.getDay(); d.setDate(d.getDate()-(g===0?6:g-1)); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function gioCorto(iso){ var g=['dom','lun','mar','mer','gio','ven','sab']; var p=iso.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return g[d.getDay()]+' '+d.getDate(); }
function gioSposta(n){ gioData = gioPiuGiorni(gioData, n); gioLavori=[]; gioCaricata=''; gioSettimana=null; render(); }

function renderGiornata(){
  if(!dipPin) return dipSchermataCodice();
  if(!gioData) gioData = gioOggi();
  if(gioCaricata!==gioData && !gioCarico){ gioCaricaGiornata(); }

  const daFare = gioLavori.filter(function(l){ return l.stato==='assegnata'; });
  const chiusi = gioLavori.filter(function(l){ return l.stato && l.stato!=='assegnata'; });
  const minuti = chiusi.reduce(function(s,l){ return s+(parseInt(l.minuti,10)||0); },0);

  let h = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    + '<div style="flex:1;font-size:16px;font-weight:600">'+dipEsc(dipNome)+'</div>'
    + '<button onclick="dipEsci()" style="border:0.5px solid #e0e0e0;background:#fff;border-radius:14px;padding:5px 11px;font-size:11.5px;color:#888;cursor:pointer;font-family:inherit">cambia codice</button></div>';

  h += '<div style="display:flex;align-items:center;gap:8px;margin:8px 0 10px">'
    + '<button onclick="gioSposta(-1)" style="background:#fff;border:0.5px solid #d8d8d8;border-radius:9px;width:40px;height:38px;font-size:17px;cursor:pointer;font-family:inherit">&lsaquo;</button>'
    + '<div style="flex:1;text-align:center;font-size:13.5px;font-weight:600">'+gioEtichetta(gioData)+'</div>'
    + '<button onclick="gioSposta(1)" style="background:#fff;border:0.5px solid #d8d8d8;border-radius:9px;width:40px;height:38px;font-size:17px;cursor:pointer;font-family:inherit">&rsaquo;</button></div>';

  h += '<div style="background:#1a1a1a;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px">'
    + '<span style="flex:1;font-size:12px;color:#bbb">Ore della giornata<br>'+chiusi.length+' lavorazioni chiuse</span>'
    + '<span style="font-size:19px;font-weight:700">'+gioOre(minuti)+'</span></div>';

  if(gioCarico) return h + '<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">Carico...</div>';

  h += '<div style="font-size:12px;font-weight:700;letter-spacing:.1em;color:#8a8a8a;margin:16px 3px 9px">DA FARE'+(daFare.length?' &middot; '+daFare.length:'')+'</div>';
  if(!daFare.length){
    h += '<div style="text-align:center;color:#aaa;font-size:13px;padding:20px 10px">'
      + (chiusi.length ? 'Niente altro di assegnato per questo giorno.' : 'Nessuna mansione assegnata.<br>Segna tu quello che hai fatto, qui sotto.')
      + '</div>';
  }
  daFare.forEach(function(l){ h += gioRiga(l); });

  h += '<button class="btn-primary" style="margin-top:12px" onclick="gioApriAggiungi()">+ Aggiungi lavorazione</button>';

  if(chiusi.length){
    h += '<div style="font-size:12px;font-weight:700;letter-spacing:.1em;color:#8a8a8a;margin:18px 3px 9px">GIA&rsquo; SEGNATE</div>';
    chiusi.forEach(function(l){ h += gioRiga(l); });
  }
  h += gioRiassunto();
  return h;
}

function gioRiga(l){
  const i = gioLavori.indexOf(l);
  const fatta = l.stato==='fatta', saltata = l.stato==='non fatta';
  const segno = fatta ? '&#10003;' : (saltata ? '!' : '');
  const sfondo = fatta ? '#1f8a4c' : (saltata ? '#C8791A' : 'transparent');
  const bordo = fatta ? '#1f8a4c' : (saltata ? '#C8791A' : '#c9c9c9');
  let sotto = [];
  if(l.sede) sotto.push(dipEsc(l.sede));
  if(l.pianoDesc) sotto.push('#'+dipEsc(l.pianoNum)+' '+dipEsc(l.pianoDesc));
  else if(l.estMarca) sotto.push('esterno: '+dipEsc(l.estMarca)+' '+dipEsc(l.estModello||''));
  if(saltata && l.motivo) sotto.push('non fatta: '+dipEsc(l.motivo));
  if(l.note) sotto.push(dipEsc(l.note));
  return '<div onclick="gioApriChiusura('+i+')" style="display:flex;align-items:flex-start;gap:11px;background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer">'
    + '<div style="width:22px;height:22px;border:1.5px solid '+bordo+';background:'+sfondo+';color:#fff;border-radius:6px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">'+segno+'</div>'
    + '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500;line-height:1.3">'+dipEsc(l.lavorazione)+'</div>'
    + (sotto.length?'<div style="font-size:11.5px;color:#999;margin-top:4px">'+sotto.join(' &middot; ')+'</div>':'')+'</div>'
    + (l.minuti?'<div style="font-size:13px;font-weight:700;color:#A01020;white-space:nowrap">'+gioOre(l.minuti)+'</div>':'')
    + '</div>';
}

async function gioCaricaGiornata(){
  if(gioCarico || !dipPin) return;
  gioCarico = true;
  try{
    const r = await dipChiedi('giornata', {pin:dipPin, data:gioData});
    if(r.ok){ gioLavori = r.lavori||[]; gioCaricata = gioData; }
  }catch(e){}
  gioCarico = false;
  render();
  gioCaricaSettimana();
}

/* ---------- il riassunto della settimana ---------- */

function gioRiassunto(){
  if(!gioSettimana) return '<div id="gio-settimana"></div>';
  const da = gioLunedi(gioData), a = gioPiuGiorni(da,6);
  const fatte = gioSettimana.filter(function(l){ return l.stato==='fatta'; });
  const saltate = gioSettimana.filter(function(l){ return l.stato==='non fatta'; }).length;
  const totale = fatte.reduce(function(s,l){ return s+(parseInt(l.minuti,10)||0); },0);
  let perGiorno={}, perCat={}, perSede={};
  for(var i=0;i<7;i++) perGiorno[gioPiuGiorni(da,i)]={min:0};
  fatte.forEach(function(l){
    const g=String(l.data).slice(0,10), m=parseInt(l.minuti,10)||0;
    if(perGiorno[g]) perGiorno[g].min += m;
    perCat[l.categoria||'ALTRO'] = (perCat[l.categoria||'ALTRO']||0)+m;
    perSede[l.sede||'-'] = (perSede[l.sede||'-']||0)+m;
  });
  let max=1; Object.keys(perGiorno).forEach(function(g){ if(perGiorno[g].min>max) max=perGiorno[g].min; });

  let h = '<div id="gio-settimana"><div style="font-size:12px;font-weight:700;letter-spacing:.1em;color:#8a8a8a;margin:18px 3px 9px">LA MIA SETTIMANA</div>'
    + '<div class="card">'
    + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px"><span style="font-size:12px;color:#999">'+gioCorto(da)+' &ndash; '+gioCorto(a)+'</span>'
    + '<b style="margin-left:auto;font-size:19px;color:#A01020">'+gioOre(totale)+'</b></div>';
  Object.keys(perGiorno).forEach(function(g){
    const v=perGiorno[g], largo=Math.round((v.min/max)*100), qui=(g===gioData);
    h += '<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">'
      + '<span style="font-size:11.5px;color:'+(qui?'#A01020':'#999')+';width:46px;font-weight:'+(qui?'700':'400')+'">'+gioCorto(g)+'</span>'
      + '<div style="flex:1;height:9px;background:#f0f0f0;border-radius:5px;overflow:hidden"><div style="width:'+largo+'%;height:100%;background:'+(v.min?'#A01020':'transparent')+'"></div></div>'
      + '<span style="font-size:11.5px;color:#666;width:52px;text-align:right">'+(v.min?gioOre(v.min):'&mdash;')+'</span></div>';
  });
  h += '<div style="display:flex;gap:10px;margin-top:12px;font-size:11.5px;color:#888"><span>'+fatte.length+' lavorazioni</span>'
    + (saltate?'<span style="color:#C8791A">'+saltate+' non fatte</span>':'')+'</div>';
  const cats = Object.keys(perCat).sort(function(x,y){ return perCat[y]-perCat[x]; }).slice(0,5);
  if(cats.length){
    h += '<div style="border-top:0.5px solid #f0f0f0;margin-top:12px;padding-top:10px">';
    cats.forEach(function(c){ h += '<div style="display:flex;font-size:12px;padding:3px 0"><span style="flex:1;color:#666;padding-right:10px">'+dipEsc(c)+'</span><b>'+gioOre(perCat[c])+'</b></div>'; });
    h += '</div>';
  }
  const sedi = Object.keys(perSede).sort(function(x,y){ return perSede[y]-perSede[x]; });
  if(sedi.length){
    h += '<div style="border-top:0.5px solid #f0f0f0;margin-top:10px;padding-top:10px;display:flex;flex-wrap:wrap;gap:6px">';
    sedi.forEach(function(s){ h += '<span style="background:#f5f5f5;border-radius:8px;padding:4px 9px;font-size:11px;color:#666">'+dipEsc(s)+' <b style="color:#1a1a1a">'+gioOre(perSede[s])+'</b></span>'; });
    h += '</div>';
  }
  return h + '</div></div>';
}

async function gioCaricaSettimana(){
  if(!dipPin) return;
  const da = gioLunedi(gioData), a = gioPiuGiorni(da,6);
  try{
    const r = await dipChiedi('periodo', {pin:dipPin, da:da, a:a});
    if(r.ok){ gioSettimana = r.lavori||[]; if(currentTab==='giornata') render(); }
  }catch(e){}
}

/* ---------- il foglio che scorre su dalla base ---------- */

function gioFoglio(html){
  let v = document.getElementById('gio-velo');
  if(!v){
    v = document.createElement('div');
    v.id = 'gio-velo';
    v.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9000';
    v.onclick = function(e){ if(e.target===v) gioChiudi(); };
    v.innerHTML = '<div id="gio-foglio" style="background:#f5f5f5;width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 14px 28px;max-height:92vh;overflow-y:auto"></div>';
    document.body.appendChild(v);
  }
  document.getElementById('gio-foglio').innerHTML = html;
  v.style.display = 'flex';
}
function gioChiudi(){ const v=document.getElementById('gio-velo'); if(v) v.style.display='none'; gioForm=null; }

const GIO_MINUTI = [15,30,45,60,90,120,180,240];
function gioTitolo(t){ return '<div style="font-size:12px;font-weight:700;letter-spacing:.1em;color:#8a8a8a;margin:14px 3px 9px">'+t+'</div>'; }
function gioErrore(e){ return e ? '<div style="background:#fdeced;color:#A32D2D;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:10px">'+dipEsc(e)+'</div>' : ''; }
function gioChip(testo, acceso, azione){
  return '<button onclick="'+azione+'" style="border:0.5px solid '+(acceso?'#A01020':'#d8d8d8')+';background:'+(acceso?'rgba(160,16,32,.9)':'#fff')+';color:'+(acceso?'#fff':'#1a1a1a')+';border-radius:16px;padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap">'+testo+'</button>';
}
const GIO_INPUT = 'width:100%;border:0.5px solid #d8d8d8;border-radius:10px;padding:12px;font-size:16px;font-family:inherit;background:#fff;outline:none';

/* ---------- chiudere una lavorazione assegnata ---------- */

function gioApriChiusura(i){
  const l = gioLavori[i]; if(!l) return;
  gioForm = {i:i, id:l.id, stato:'fatta', minuti:parseInt(l.minuti,10)||0, motivo:l.motivo||'', note:l.note||''};
  gioDisegnaChiusura();
}

function gioDisegnaChiusura(errore){
  const l = gioLavori[gioForm.i], f = gioForm;
  let h = '<h2 style="font-size:16px;font-weight:600;margin-bottom:3px">'+dipEsc(l.lavorazione)+'</h2>'
    + '<div style="font-size:12px;color:#999;margin-bottom:14px">'+dipEsc(l.sede||'')+(l.pianoDesc?' &middot; #'+dipEsc(l.pianoNum)+' '+dipEsc(l.pianoDesc):'')+'</div>'
    + gioErrore(errore)
    + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">'
    + gioChip('L&rsquo;ho fatta', f.stato==='fatta', "gioForm.stato='fatta';gioDisegnaChiusura()")
    + gioChip('Non l&rsquo;ho fatta', f.stato==='non fatta', "gioForm.stato='non fatta';gioDisegnaChiusura()")
    + '</div>';
  if(f.stato==='fatta'){
    h += gioTitolo('QUANTO TEMPO') + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">'
      + GIO_MINUTI.map(function(m){ return gioChip(gioOre(m), f.minuti===m, 'gioForm.minuti='+m+';gioDisegnaChiusura()'); }).join('') + '</div>'
      + '<input type="number" inputmode="numeric" placeholder="minuti" value="'+(f.minuti||'')+'" oninput="gioForm.minuti=parseInt(this.value,10)||0" style="'+GIO_INPUT+'">';
  } else {
    h += gioTitolo('PERCHE&rsquo; NON E&rsquo; STATA FATTA')
      + '<textarea placeholder="Scrivi il motivo" oninput="gioForm.motivo=this.value" style="'+GIO_INPUT+';min-height:70px">'+dipEsc(f.motivo)+'</textarea>';
  }
  h += gioTitolo('NOTE') + '<textarea placeholder="facoltative" oninput="gioForm.note=this.value" style="'+GIO_INPUT+';min-height:70px">'+dipEsc(f.note)+'</textarea>'
    + '<button class="btn-primary" id="gio-salva" style="margin-top:14px" onclick="gioSalvaChiusura()">Salva</button>'
    + '<button onclick="gioChiudi()" style="width:100%;margin-top:8px;background:#fff;border:0.5px solid #d8d8d8;border-radius:11px;padding:13px;font-size:15px;font-family:inherit;cursor:pointer">Annulla</button>';
  gioFoglio(h);
}

async function gioSalvaChiusura(){
  const b = document.getElementById('gio-salva'); if(b){ b.disabled=true; b.textContent='Salvo...'; }
  try{
    const r = await dipChiedi('chiudi', {pin:dipPin, id:gioForm.id, stato:gioForm.stato, minuti:gioForm.minuti, motivo:gioForm.motivo, note:gioForm.note});
    if(!r.ok){ if(b){ b.disabled=false; b.textContent='Salva'; } return gioDisegnaChiusura(r.errore); }
    gioChiudi(); gioLavori=[]; gioCaricata=''; gioSettimana=null; render();
  }catch(e){ if(b){ b.disabled=false; b.textContent='Salva'; } gioDisegnaChiusura('Collegamento non riuscito'); }
}

/* ---------- aggiungere una lavorazione ---------- */

function gioApriAggiungi(){
  gioForm = {sede:'', categoria:'', lavorazione:'', libera:'', cerca:'', cercaP:'',
             modo:'nessuno', pianoNum:'', pianoDesc:'',
             estMarca:'', estModello:'', estMatricola:'', estTipo:'', minuti:0, note:''};
  if(!gioListini) gioCaricaListini();
  gioDisegnaAggiungi();
}

async function gioCaricaListini(){
  try{
    const r = await dipChiedi('listini', {pin:dipPin});
    if(r.ok){ gioListini = r; if(gioForm) gioDisegnaAggiungi(); }
  }catch(e){}
}

function gioDisegnaAggiungi(errore){
  const f = gioForm;
  let h = '<h2 style="font-size:16px;font-weight:600;margin-bottom:3px">Aggiungi lavorazione</h2>'
    + '<div style="font-size:12px;color:#999;margin-bottom:14px">'+gioEtichetta(gioData)+'</div>'
    + gioErrore(errore);

  if(!gioListini) return gioFoglio(h + '<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">Carico l&rsquo;elenco...</div>');

  h += gioTitolo('DOVE') + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">'
    + (gioListini.sedi||[]).map(function(s){ return gioChip(dipEsc(s), f.sede===s, "gioForm.sede='"+s.replace(/'/g,"\\'")+"';gioDisegnaAggiungi()"); }).join('')
    + '</div>';

  const cats = Object.keys(gioListini.lavorazioni||{});
  h += gioTitolo('CHE COSA') + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">'
    + cats.map(function(c){ return gioChip(dipEsc(c), f.categoria===c, "gioForm.categoria='"+c.replace(/'/g,"\\'")+"';gioForm.lavorazione='';gioForm.cerca='';gioDisegnaAggiungi()"); }).join('')
    + '</div>';

  if(f.categoria){
    let voci = (gioListini.lavorazioni[f.categoria]||[]).slice();
    const q = (f.cerca||'').toUpperCase();
    if(q) voci = voci.filter(function(v){ return v.toUpperCase().indexOf(q)>=0; });
    h += '<input placeholder="cerca nella categoria" value="'+dipEsc(f.cerca)+'" oninput="gioForm.cerca=this.value;gioDisegnaAggiungi()" style="'+GIO_INPUT+';margin-bottom:8px">';
    h += '<div style="max-height:40vh;overflow-y:auto;background:#fff;border:0.5px solid #e0e0e0;border-radius:11px">'
      + voci.map(function(v){
          const sel = f.lavorazione===v ? 'background:#fdeced;font-weight:600;' : '';
          return '<div onclick="gioForm.lavorazione=\''+v.replace(/'/g,"\\'")+'\';gioDisegnaAggiungi()" style="'+sel+'padding:12px 13px;border-bottom:0.5px solid #f0f0f0;font-size:13.5px;cursor:pointer">'+dipEsc(v)+'</div>';
        }).join('')
      + '<div onclick="gioForm.lavorazione=\'ALTRO\';gioDisegnaAggiungi()" style="padding:12px 13px;font-size:13.5px;cursor:pointer;color:#A01020;font-weight:600">ALTRO &mdash; scrivo io</div></div>';
    if(f.lavorazione==='ALTRO'){
      h += '<input placeholder="scrivi la lavorazione" value="'+dipEsc(f.libera)+'" oninput="gioForm.libera=this.value" style="'+GIO_INPUT+';margin-top:8px">'
        + '<div style="font-size:11.5px;color:#999;margin:6px 3px 0">Quello che scrivi qui entra nell&rsquo;elenco: la prossima volta lo trovi gia&rsquo; pronto.</div>';
    }
  }

  h += gioTitolo('SU QUALE PIANOFORTE') + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">'
    + gioChip('nessuno', f.modo==='nessuno', "gioForm.modo='nessuno';gioDisegnaAggiungi()")
    + gioChip('dei nostri', f.modo==='nostro', "gioForm.modo='nostro';gioDisegnaAggiungi()")
    + gioChip('esterno', f.modo==='esterno', "gioForm.modo='esterno';gioDisegnaAggiungi()")
    + '</div>';

  if(f.modo==='esterno'){
    h += '<input placeholder="marca" value="'+dipEsc(f.estMarca)+'" oninput="gioForm.estMarca=this.value" style="'+GIO_INPUT+'">'
      + '<input placeholder="modello" value="'+dipEsc(f.estModello)+'" oninput="gioForm.estModello=this.value" style="'+GIO_INPUT+';margin-top:8px">'
      + '<input placeholder="matricola" value="'+dipEsc(f.estMatricola)+'" oninput="gioForm.estMatricola=this.value" style="'+GIO_INPUT+';margin-top:8px">'
      + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:9px">'
      + gioChip('verticale', f.estTipo==='VERTICALE', "gioForm.estTipo='VERTICALE';gioDisegnaAggiungi()")
      + gioChip('coda', f.estTipo==='CODA', "gioForm.estTipo='CODA';gioDisegnaAggiungi()")
      + '</div>';
  } else if(f.modo==='nostro' && f.pianoNum){
    h += '<div class="card" style="padding:11px 12px;display:flex;align-items:center;gap:9px"><b>#'+dipEsc(f.pianoNum)+'</b>'
      + '<span style="flex:1">'+dipEsc(f.pianoDesc)+'</span>'
      + gioChip('cambia', false, "gioForm.pianoNum='';gioForm.pianoDesc='';gioDisegnaAggiungi()") + '</div>';
  } else if(f.modo==='nostro'){
    const pf = gioListini.pianoforti || [];
    h += '<input placeholder="numero, marca, modello o matricola" value="'+dipEsc(f.cercaP)+'" oninput="gioForm.cercaP=this.value;gioDisegnaAggiungi()" style="'+GIO_INPUT+'">';
    const qp = (f.cercaP||'').toUpperCase();
    const trovati = qp ? pf.filter(function(p){ return (String(p.numero)+' '+(p.marca||'')+' '+(p.modello||'')+' '+(p.matricola||'')).toUpperCase().indexOf(qp)>=0; }).slice(0,25) : [];
    if(trovati.length){
      h += '<div style="max-height:34vh;overflow-y:auto;background:#fff;border:0.5px solid #e0e0e0;border-radius:11px;margin-top:8px">'
        + trovati.map(function(p){
            const d = ((p.marca||'')+' '+(p.modello||'')).trim();
            return '<div onclick="gioScegliPiano(\''+String(p.numero)+'\',\''+d.replace(/'/g,"\\'")+'\')" style="padding:12px 13px;border-bottom:0.5px solid #f0f0f0;font-size:13.5px;cursor:pointer">'
              + '<b>#'+dipEsc(p.numero)+'</b> '+dipEsc(d)+(p.matricola?' <span style="color:#bbb">'+dipEsc(p.matricola)+'</span>':'')+'</div>';
          }).join('') + '</div>';
    } else if(qp){ h += '<div style="font-size:11.5px;color:#999;margin:6px 3px 0">nessun pianoforte trovato</div>'; }
  }

  h += gioTitolo('QUANTO TEMPO') + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">'
    + GIO_MINUTI.map(function(m){ return gioChip(gioOre(m), f.minuti===m, 'gioForm.minuti='+m+';gioDisegnaAggiungi()'); }).join('') + '</div>'
    + '<input type="number" inputmode="numeric" placeholder="minuti" value="'+(f.minuti||'')+'" oninput="gioForm.minuti=parseInt(this.value,10)||0" style="'+GIO_INPUT+'">';

  h += gioTitolo('NOTE') + '<textarea placeholder="facoltative" oninput="gioForm.note=this.value" style="'+GIO_INPUT+';min-height:70px">'+dipEsc(f.note)+'</textarea>'
    + '<button class="btn-primary" id="gio-salva" style="margin-top:14px" onclick="gioSalvaAggiunta()">Segna come fatta</button>'
    + '<button onclick="gioChiudi()" style="width:100%;margin-top:8px;background:#fff;border:0.5px solid #d8d8d8;border-radius:11px;padding:13px;font-size:15px;font-family:inherit;cursor:pointer">Annulla</button>';
  gioFoglio(h);
}

function gioScegliPiano(num, desc){ gioForm.pianoNum=num; gioForm.pianoDesc=desc; gioDisegnaAggiungi(); }

async function gioSalvaAggiunta(){
  const f = gioForm;
  const voce = f.lavorazione==='ALTRO' ? (f.libera||'').trim() : f.lavorazione;
  if(!f.sede) return gioDisegnaAggiungi('Scegli dove hai lavorato');
  if(!voce) return gioDisegnaAggiungi('Scegli la lavorazione');
  if(!f.minuti) return gioDisegnaAggiungi('Manca il tempo impiegato');
  const nostro = f.modo==='nostro', fuori = f.modo==='esterno';
  const b = document.getElementById('gio-salva'); if(b){ b.disabled=true; b.textContent='Salvo...'; }
  try{
    const r = await dipChiedi('aggiungi', {pin:dipPin, data:gioData, sede:f.sede, categoria:f.categoria, lavorazione:voce,
      pianoNum:nostro?f.pianoNum:'', pianoDesc:nostro?f.pianoDesc:'',
      estMarca:fuori?f.estMarca:'', estModello:fuori?f.estModello:'',
      estMatricola:fuori?f.estMatricola:'', estTipo:fuori?f.estTipo:'', minuti:f.minuti, note:f.note});
    if(!r.ok){ if(b){ b.disabled=false; b.textContent='Segna come fatta'; } return gioDisegnaAggiungi(r.errore); }
    gioChiudi(); gioListini=null; gioLavori=[]; gioCaricata=''; gioSettimana=null; render();
  }catch(e){ if(b){ b.disabled=false; b.textContent='Segna come fatta'; } gioDisegnaAggiungi('Collegamento non riuscito'); }
}

/* ---------- disponibilita': solo marca, modello, matricola ---------- */

function renderDisponibilita(){
  if(!dipPin) return dipSchermataCodice();
  if(!dipPianoforti.length){
    if(!dipCaricamento){ dipCaricaPianoforti(); }
    return '<div style="text-align:center;color:#aaa;padding:34px;font-size:13px">Carico gli strumenti...</div>';
  }
  const gruppo = dipPianoforti.filter(function(p){ return String(p.stato).toUpperCase()===dipStato; });
  const q = (dipCerca||'').toUpperCase();
  const lista = q ? gruppo.filter(function(p){ return ((p.marca||'')+' '+(p.modello||'')+' '+(p.matricola||'')).toUpperCase().indexOf(q)>=0; }) : gruppo;
  const conta = function(s){ return dipPianoforti.filter(function(p){ return String(p.stato).toUpperCase()===s; }).length; };

  let h = '<div style="display:flex;gap:7px;margin-bottom:10px">'
    + ['N','D'].map(function(s){
        const on = dipStato===s, et = s==='N' ? 'Noleggio' : 'Deposito';
        return '<button onclick="dipStato=\''+s+'\';dipCerca=\'\';render()" style="flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;line-height:1.25;cursor:pointer;font-family:inherit;border:0.5px solid '
          +(on?'#A01020':'#e0e0e0')+';background:'+(on?'rgba(160,16,32,0.9)':'#fff')+';color:'+(on?'#fff':'#999')+'">'
          + et + '<span style="display:block;font-size:15px;font-weight:700;margin-top:1px">'+conta(s)+'</span></button>';
      }).join('') + '</div>';
  h += '<input placeholder="marca, modello o matricola" value="'+dipEsc(dipCerca)+'" oninput="dipCerca=this.value;render()" style="'+GIO_INPUT+';font-size:14px;padding:10px 11px;margin-bottom:10px">';
  h += '<div style="font-size:12px;color:#888;margin-bottom:8px">'+lista.length+' strumenti</div>';
  if(!lista.length) return h + '<div style="text-align:center;color:#aaa;padding:26px;font-size:13px">Nessuno strumento trovato</div>';
  h += lista.slice(0,300).map(function(p){
    return '<div style="background:#fff;border:0.5px solid #e0e0e0;border-radius:11px;padding:11px 12px;margin-bottom:8px">'
      + '<div style="font-size:14px;font-weight:600">'+dipEsc((p.marca||'').trim())+' '+dipEsc(p.modello||'')+'</div>'
      + '<div style="font-size:12px;color:#888;margin-top:3px">matricola '+(p.matricola?dipEsc(p.matricola):'&mdash;')+'</div></div>';
  }).join('');
  if(lista.length>300) h += '<div style="text-align:center;color:#aaa;font-size:12px;padding:6px">mostrati i primi 300</div>';
  return h;
}

async function dipCaricaPianoforti(){
  if(dipCaricamento) return;
  dipCaricamento = true;
  try{
    const r = await dipChiedi('listini', {pin:dipPin});
    if(r.ok) dipPianoforti = (r.pianoforti||[]).filter(function(p){ const s=String(p.stato).toUpperCase(); return s==='N'||s==='D'; });
  }catch(e){}
  dipCaricamento = false;
  render();
}

// All'apertura si riprende il codice gia' dato su questo telefono, e si chiede
// allo script solo il nome: se nel frattempo Andrea l'ha disattivato, il codice
// viene buttato e la sezione torna a chiederlo.
(function(){
  dipPin = dipLeggi('pf_pin_dip');
  gioData = gioOggi();
  if(!dipPin) return;
  dipChiedi('entra',{pin:dipPin}).then(function(r){
    if(r && r.ok){ dipNome = r.dipendente.nome; if(currentTab==='giornata'||currentTab==='dispo') render(); }
    else { dipPin=''; try{ localStorage.removeItem('pf_pin_dip'); }catch(e){} }
  }).catch(function(){});
})();

load();render();
</script>
